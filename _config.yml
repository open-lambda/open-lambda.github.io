# Book settings - https://jupyterbook.org/customize/config.html
title: OpenLambda
author: OpenLambda
logo: _static/open-lambda.png

# Force re-execution of notebooks on each build
execute:
  execute_notebooks: "off"

# Files Sphinx should ignore (keeps the GitHub README out of the toctree warning)
exclude_patterns: [README.md, CONTRIBUTING.md]

# HTML-specific settings
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: false
  extra_footer: |
    <p>Licensed under the <a href="https://opensource.org/licenses/Apache-2.0">Apache 2.0 License</a>.
    Built with <a href="https://jupyterbook.org">Jupyter Book</a> and MyST Markdown.</p>

# Repository info (used for issue/edit buttons)
repository:
  url: https://github.com/open-lambda/open-lambda.github.io
  branch: master
  path_to_book: "."

# MyST extensions - single parse block (duplicate was causing only the first to be read)
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - fieldlist
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - strikethrough
    - substitution
    - tasklist
  myst_url_schemes: [mailto, http, https]
  myst_dmath_double_inline: true

# Sphinx configuration
sphinx:
  extra_extensions:
    - ablog
    - sphinxext.opengraph
    - notfound.extension
  config:
    html_theme: "sphinx_book_theme"
    html_show_sourcelink: false
    html_favicon: "_static/open-lambda.png"

    # ---- Open Graph / social-card metadata ----
    ogp_site_url: "https://open-lambda.github.io/"
    ogp_site_name: "OpenLambda"
    ogp_image: "https://open-lambda.github.io/_static/open-lambda.png"
    ogp_use_first_image: true

    # ---- Custom 404 page ----
    # This is a root (user/org) Pages site, so served from "/".
    notfound_urls_prefix: "/"

    # ---- Link checking ----
    # usenix.org returns 403 to automated checkers (bot protection) but the
    # links resolve fine in a browser, so skip them in linkcheck.
    linkcheck_ignore:
      - "https://www\\.usenix\\.org/.*"
    # GitHub blob pages render heading anchors with client-side JS that
    # linkcheck can't see; don't fail on missing anchors there.
    linkcheck_anchors_ignore_for_url:
      - "https://github\\.com/.*"
    # Keep linkcheck fast: cap retries and how long we wait out a rate limit.
    linkcheck_timeout: 15
    linkcheck_retries: 1
    linkcheck_rate_limit_timeout: 30
    html_theme_options:
      use_download_button: false
      navigation_depth: 2
      show_navbar_depth: 1
      announcement: "🚧 OpenLambda is a research project under active development — <a href='https://github.com/open-lambda/open-lambda'>follow along on GitHub</a>."
      logo:
        text: "OpenLambda"

    # ---- ABlog config ----
    blog_path: "blog"
    blog_title: "OpenLambda Blog"
    blog_baseurl: "https://open-lambda.github.io/"
    blog_authors:
      open-lambda:
        - "OpenLambda Team"
        - "https://open-lambda.org"
      maria-oros:
        - "Maria Oros"
        - "https://dsi.wisc.edu/staff/oros-maria/"
      tyler-caraza-harter:
        - "Tyler Caraza-Harter"
        - "https://www.cs.wisc.edu/staff/harter-tyler-2/"
    blog_default_author: open-lambda
    blog_feed_archives: true
    post_date_format: "%Y-%m-%d"
    post_auto_image: 1
    post_auto_excerpt: 2
    fontawesome_included: true

    # Show ABlog widgets on blog pages only
    html_sidebars:
      blog/**:
        - ablog/postcard.html
        - ablog/recentposts.html
        - ablog/tagcloud.html
        - ablog/categories.html
        - ablog/archives.html
      blog:
        - ablog/postcard.html
        - ablog/recentposts.html
        - ablog/tagcloud.html
        - ablog/categories.html
        - ablog/archives.html